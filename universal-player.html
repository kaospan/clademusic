<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Player</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #provider {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- Intentionally empty. This frame is mounted on every page from the
         moment the app loads (the player is a singleton iframe reused across
         provider switches), so anything rendered here is on screen before
         anyone has asked to play anything. It used to read "Select a provider
         to start playback.", which showed to signed-in listeners and guests
         alike as an instruction to do something they had not asked to do -
         and kept showing even with a track already loaded and its provider
         buttons right there. The frame now stays blank until a provider is
         actually loaded into it. -->
    <div id="root" aria-label="Universal player frame"></div>

    <script>
      (() => {
        const root = document.getElementById('root');
        const parentOrigin = window.location.origin;
        let providerFrame = null;
        let current = { provider: null, id: null, src: null, requestId: 0 };

        const ensureProviderFrame = () => {
          if (providerFrame) return providerFrame;
          providerFrame = document.createElement('iframe');
          providerFrame.id = 'provider';
          providerFrame.title = 'Provider player';
          providerFrame.allow =
            'autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write';
          providerFrame.setAttribute('referrerpolicy', 'origin-when-cross-origin');
          providerFrame.setAttribute('allowfullscreen', 'true');
          providerFrame.setAttribute('loading', 'eager');
          providerFrame.setAttribute('tabindex', '0');
          providerFrame.src = 'about:blank';
          root.appendChild(providerFrame);
          return providerFrame;
        };

        const swapSrc = (next) => {
          const frame = ensureProviderFrame();
          // Hard-stop previous provider by unloading.
          frame.src = 'about:blank';
          requestAnimationFrame(() => {
            frame.src = next.src;
          });
          if (next.provider === 'youtube') startYouTubeListening();
          else stopYouTubeListening();
        };

        // Forwards a transport command to whichever provider iframe is
        // currently loaded. YouTube's embed (with enablejsapi=1, set by
        // buildEmbedSrc) listens for exactly this postMessage shape without
        // needing its full IFrame API script loaded. Spotify's plain embed
        // iframe has no equivalent public postMessage control surface, so
        // there's nothing to forward there - Premium playback goes through
        // the separate Web Playback SDK instead, which controls Spotify for
        // real.
        const sendProviderCommand = (command, args) => {
          if (current.provider !== 'youtube') return;
          if (!providerFrame || !providerFrame.contentWindow) return;
          providerFrame.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: command, args: args || [] }),
            '*'
          );
        };

        // ---- YouTube state relay ----
        // Same undocumented-but-standard wire protocol the commands above
        // already use: telling the embed something is "listening" makes it
        // start posting periodic infoDelivery messages back with real
        // position/duration/state, which we forward up to the app as
        // universal-player:state. Without this, position/duration for any
        // YouTube playback through this embed just sat at whatever they were
        // initialized to (0) forever - the seekbar's smooth motion came
        // entirely from the app's own optimistic RAF extrapolation, never
        // corrected against reality.
        let ytListenTimer = null;

        const startYouTubeListening = () => {
          stopYouTubeListening();
          const announce = () => {
            if (current.provider !== 'youtube' || !providerFrame || !providerFrame.contentWindow) return;
            providerFrame.contentWindow.postMessage(
              JSON.stringify({ event: 'listening', id: 'widget', channel: 'widget' }),
              '*'
            );
          };
          announce();
          // Re-announce periodically rather than once: there's no reliable
          // "iframe finished loading" signal for a cross-origin frame, and a
          // message sent before YouTube's own script has initialized is
          // simply dropped, not queued.
          ytListenTimer = setInterval(announce, 1000);
        };

        const stopYouTubeListening = () => {
          if (ytListenTimer) {
            clearInterval(ytListenTimer);
            ytListenTimer = null;
          }
        };

        window.addEventListener('message', (event) => {
          // Messages FROM the embedded YouTube iframe itself arrive from a
          // different origin (youtube.com) than ours, so they're identified
          // by source, not origin, and handled before the same-origin check
          // below (which exists for commands coming down from the app and
          // would otherwise drop these).
          if (providerFrame && event.source === providerFrame.contentWindow && current.provider === 'youtube') {
            let data = event.data;
            if (typeof data === 'string') {
              try {
                data = JSON.parse(data);
              } catch (e) {
                return;
              }
            }
            if (data && data.event === 'infoDelivery' && data.info) {
              const info = data.info;
              // infoDelivery messages are PARTIAL: after the initial full
              // payload, YouTube sends only the fields that changed. Reading
              // every message as if it were complete meant an ordinary
              // progress tick carrying just currentTime was relayed as
              // "duration 0, not playing" - `undefined === 1` is false, so
              // isPlaying was reported false several times a second while the
              // track was plainly playing. That left the transport button
              // stuck showing Play during playback and kept collapsing the
              // seekbar's duration to 0:00. Send only what this message
              // actually carries and let the app keep the rest.
              const payload = {};
              if (typeof info.currentTime === 'number') {
                payload.positionMs = Math.max(0, info.currentTime * 1000);
              }
              if (typeof info.duration === 'number' && info.duration > 0) {
                payload.durationMs = Math.max(0, info.duration * 1000);
              }
              if (typeof info.playerState === 'number') {
                // 1 PLAYING, 3 BUFFERING. Buffering counts as playing on
                // purpose: it's a stall inside playback, not a pause, and
                // reporting it as stopped made the button flip to Play and
                // back on every buffer.
                payload.isPlaying = info.playerState === 1 || info.playerState === 3;
              }
              // Nothing we track changed - staying silent beats sending a
              // no-op state update that re-renders every player consumer.
              if (Object.keys(payload).length === 0) return;
              window.parent.postMessage(
                { type: 'universal-player:state', payload },
                parentOrigin
              );
            }
            return;
          }

          if (!event || event.origin !== parentOrigin) return;
          const data = event && event.data;
          if (!data || typeof data !== 'object') return;

          if (data.type === 'universal-player:command') {
            const payload = data.payload || {};
            if (payload.command === 'play') sendProviderCommand('playVideo');
            else if (payload.command === 'pause') sendProviderCommand('pauseVideo');
            else if (payload.command === 'seek' && typeof payload.seconds === 'number') {
              sendProviderCommand('seekTo', [Math.max(0, payload.seconds), true]);
            } else if (payload.command === 'setVolume' && typeof payload.volume === 'number') {
              sendProviderCommand('setVolume', [Math.round(Math.max(0, Math.min(1, payload.volume)) * 100)]);
            } else if (payload.command === 'setMute') {
              sendProviderCommand(payload.muted ? 'mute' : 'unMute');
            }
            return;
          }

          if (data.type !== 'universal-player:play') return;

          const next = data.payload;
          if (!next || typeof next !== 'object') return;

          const provider = next.provider;
          const id = next.id;
          const src = next.src;
          const requestId = typeof next.requestId === 'number' ? next.requestId : 0;

          if (!provider || !id || !src) return;
          // Ignore out-of-order (debounced) updates.
          if (requestId < current.requestId) return;

          if (provider === current.provider && id === current.id && src === current.src) {
            current.requestId = requestId;
            return;
          }

          current = { provider, id, src, requestId };
          swapSrc(current);
        });
      })();
    </script>
  </body>
</html>
